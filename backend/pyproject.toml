[project]
name = "strata"
version = "0.1.0"
description = "A plugin-based file browser with swappable storage backends."
requires-python = ">=3.14"
dependencies = [
    "aiofiles>=25.1",
    "aiosqlite>=0.22.1",
    "alembic>=1.18.4",
    "anyio>=4.13.0",
    "fastapi>=0.136",
    "pydantic-settings>=2.14",
    "pydantic>=2.13",
    "python-multipart>=0.0.27",
    "sqlalchemy[asyncio]>=2.0",
    "uvicorn[standard]>=0.46",
]

[project.optional-dependencies]
all = [
    "strata-collabora",
    "strata-image-preview",
    "strata-jwt-auth",
    "strata-local-storage",
    "strata-s3-storage",
    "strata-search-fulltext",
    "strata-smb-storage",
]

[build-system]
requires = ["uv_build>=0.11.8,<0.12"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.6",
    "pyright>=1.1",
]

[tool.uv]
required-version = ">=0.9.0"

[tool.uv.sources]
strata-image-preview = { workspace = true }
strata-local-storage = { workspace = true }
strata-smb-storage = { workspace = true }
strata-s3-storage = { workspace = true }
strata-collabora = { workspace = true }
strata-jwt-auth = { workspace = true }
strata-search-fulltext = { workspace = true }

[tool.uv.workspace]
members = ["plugins/*"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "PTH", "RUF", "PL"]
ignore = ["PLR2004"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pyright]
pythonVersion = "3.14"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"
extraPaths = [
    "src/",
    "plugins/collabora/src/",
    "plugins/image_preview/src/",
    "plugins/jwt_auth/src/",
    "plugins/local_storage/src/",
    "plugins/s3_storage/src/",
    "plugins/search_fulltext/src/",
    "plugins/smb_storage/src/",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = [
    "src",
    "plugins/jwt_auth/src",
    "plugins/local_storage/src",
    "plugins/smb_storage/src",
    "plugins/s3_storage/src",
    "plugins/image_preview/src",
    "plugins/collabora/src",
    "plugins/search_fulltext/src",
]
