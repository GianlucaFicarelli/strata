[project]
name = "strata"
version = "0.1.0"
description = "A plugin-based file browser with swappable storage backends."
requires-python = ">=3.14"
dependencies = [
    "aiofiles>=25.1",
    "aiosqlite>=0.22.1",
    "alembic>=1.18.4",
    "anyio>=4.13.0",
    "fastapi>=0.136",
    "pydantic-settings>=2.14",
    "pydantic>=2.13",
    "python-multipart>=0.0.27",
    "sqlalchemy[asyncio]>=2.0",
    "uvicorn[standard]>=0.46",
]

[project.optional-dependencies]
all = [
    "strata-collabora",
    "strata-image-preview",
    "strata-jwt-auth",
    "strata-local-storage",
    "strata-s3-storage",
    "strata-search-fulltext",
    "strata-smb-storage",
]

[build-system]
requires = ["uv_build>=0.11.8,<0.12"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "coverage[toml]>=7.14.0",
    "httpx>=0.27",
    "pyright>=1.1",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=7.1.0",
    "ruff>=0.6",
]

[tool.uv]
required-version = ">=0.9.0"

[tool.uv.sources]
strata-image-preview = { workspace = true }
strata-local-storage = { workspace = true }
strata-smb-storage = { workspace = true }
strata-s3-storage = { workspace = true }
strata-collabora = { workspace = true }
strata-jwt-auth = { workspace = true }
strata-search-fulltext = { workspace = true }

[tool.uv.workspace]
members = ["plugins/*"]

[tool.ruff]
line-length = 100
target-version = "py314"
include = ["pyproject.toml", "src/**/*.py", "tests/**/*.py", "plugins/**/*.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "PTH", "RUF", "PL"]
ignore = ["PLR2004"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "ANN", # Missing type annotation
    "D", # pydocstyle
    "ERA001", # Found commented-out code
    "PLC2701", # Private name import from external module
    "PLR2004", # magic value (constant) used in comparison (i.e. expected == 3)
    "PLR6301", # Method could be a function (class-based test organization)
    "S101", # Use of `assert` detected
    "SLF001", # private member access
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pyright]
pythonVersion = "3.14"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"
extraPaths = [
    "src/",
    "plugins/collabora/src/",
    "plugins/image_preview/src/",
    "plugins/jwt_auth/src/",
    "plugins/local_storage/src/",
    "plugins/s3_storage/src/",
    "plugins/search_fulltext/src/",
    "plugins/smb_storage/src/",
]

[tool.pytest.ini_options]
minversion = "6.0"
addopts = [
    "--import-mode=importlib",
    "-vv",
    "-ra",
    "--cov=strata",
    "--durations=10",
    "--durations-min=1.0",
]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = [
    "src",
    "plugins/jwt_auth/src",
    "plugins/local_storage/src",
    "plugins/smb_storage/src",
    "plugins/s3_storage/src",
    "plugins/image_preview/src",
    "plugins/collabora/src",
    "plugins/search_fulltext/src",
]

[tool.coverage.run]
branch = true
parallel = false
source_pkgs = [
    "strata",
    "strata_collabora",
    "strata_image_preview",
    "strata_jwt_auth",
    "strata_local_storage",
    "strata_s3_storage",
    "strata_search_fulltext",
    "strata_smb_storage",
]
data_file = ".coverage/coverage.db"

[tool.coverage.report]
show_missing = true
precision = 2
fail_under = 80
omit = [
    "__main__.py",
]

[tool.coverage.xml]
output = ".coverage/coverage.xml"

[tool.coverage.html]
directory = ".coverage/html_report"
