[project]
name = "strata-search-fulltext"
version = "0.1.0"
description = "Full-text search plugin for Strata."
requires-python = ">=3.12"
dependencies = [
    "strata>=0.1.0",
    "fastapi>=0.115",
    "whoosh>=2.7",
]

[project.entry-points."strata.plugins"]
search_fulltext = "strata_search_fulltext:plugin"

[tool.uv.sources]
strata = { workspace = true }
