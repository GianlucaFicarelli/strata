[project]
name = "strata-local-storage"
version = "0.1.0"
description = "Local filesystem storage backend for Strata."
requires-python = ">=3.14"
dependencies = [
    "strata>=0.1.0",
    "aiofiles>=24.1",
]

[project.entry-points."strata.plugins"]
local_storage = "strata_local_storage:plugin"

[tool.uv.sources]
strata = { workspace = true }

