[project]
name = "strata-collabora"
version = "0.1.0"
description = "Collabora Online (WOPI) editor plugin for Strata."
requires-python = ">=3.14"
dependencies = [
    "strata>=0.1.0",
    "fastapi>=0.115",
    "aiofiles>=24.1",
]

[project.entry-points."strata.plugins"]
collabora = "strata_collabora:plugin"

[tool.uv.sources]
strata = { workspace = true }

