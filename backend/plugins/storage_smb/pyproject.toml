[project]
name = "strata-storage-smb"
version = "0.1.0"
description = "SMB/CIFS network share storage backend for Strata."
requires-python = ">=3.12"
dependencies = [
    "strata>=0.1.0",
    "smbprotocol>=1.13",
]

[project.entry-points."strata.plugins"]
storage_smb = "strata_storage_smb:plugin"

[tool.uv.sources]
strata = { workspace = true }
