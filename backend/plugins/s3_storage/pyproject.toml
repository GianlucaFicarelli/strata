[project]
name = "strata-s3-storage"
version = "0.1.0"
description = "Amazon S3 storage backend for Strata."
requires-python = ">=3.14"
dependencies = [
    "strata>=0.1.0",
    "boto3>=1.34",
]

[project.entry-points."strata.plugins"]
s3_storage = "strata_s3_storage:plugin"

[tool.uv.sources]
strata = { workspace = true }
