[project]
name = "strata-jwt-auth"
version = "0.1.0"
description = "JWT-based password authentication plugin for Strata."
requires-python = ">=3.14"
dependencies = [
    "strata>=0.1.0",
    "fastapi>=0.115",
    "python-jose[cryptography]>=3.3",
    "passlib[argon2]>=1.7",
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.20",
]

[project.entry-points."strata.plugins"]
jwt_auth = "strata_jwt_auth:plugin"

[tool.uv.sources]
strata = { workspace = true }
