[project]
name = "strata-jwt-auth"
version = "0.1.0"
description = "JWT-based password authentication plugin for Strata."
requires-python = ">=3.14"
dependencies = [
    "aiosqlite>=0.20",
    "fastapi>=0.115",
    "pydantic>=2.13.3",
    "pydantic-settings>=2.14.0",
    "pyjwt>=2.12.1",
    "sqlalchemy[asyncio]>=2.0",
    "strata>=0.1.0",
]

[project.entry-points."strata.plugins"]
jwt_auth = "strata_jwt_auth:plugin"

[tool.uv.sources]
strata = { workspace = true }
