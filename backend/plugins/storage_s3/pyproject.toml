[project]
name = "strata-storage-s3"
version = "0.1.0"
description = "Amazon S3 storage backend for Strata."
requires-python = ">=3.14"
dependencies = [
    "strata>=0.1.0",
    "boto3>=1.34",
]

[project.entry-points."strata.plugins"]
storage_s3 = "strata_storage_s3:plugin"

[tool.uv.sources]
strata = { workspace = true }
