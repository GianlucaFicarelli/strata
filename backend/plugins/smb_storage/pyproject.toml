[project]
name = "strata-smb-storage"
version = "0.1.0"
description = "SMB/CIFS network share storage backend for Strata."
requires-python = ">=3.14"
dependencies = [
    "strata>=0.1.0",
    "smbprotocol>=1.13",
]

[project.entry-points."strata.plugins"]
smb_storage = "strata_smb_storage:plugin"

[tool.uv.sources]
strata = { workspace = true }
