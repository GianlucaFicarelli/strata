[project]
name = "strata-storage-local"
version = "0.1.0"
description = "Local filesystem storage backend for Strata."
requires-python = ">=3.12"
dependencies = [
    "strata>=0.1.0",
    "aiofiles>=24.1",
]

[project.entry-points."strata.plugins"]
storage_local = "strata_storage_local:plugin"

[tool.uv.sources]
strata = { workspace = true }
