[project]
name = "strata-image-preview"
version = "0.1.0"
description = "Image thumbnail and preview plugin for Strata."
requires-python = ">=3.12"
dependencies = [
    "strata>=0.1.0",
    "fastapi>=0.115",
    "Pillow>=10.0",
]

[project.entry-points."strata.plugins"]
image_preview = "strata_image_preview:plugin"

[tool.uv.sources]
strata = { workspace = true }
